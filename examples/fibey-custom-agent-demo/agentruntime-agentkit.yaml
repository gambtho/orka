# Export input for orka-acp-runtime --export-registration.
# Run inside the configured supervisor container; see README.md.
# The exporter fills the pinned identity, digests, limits, and guarantees.
apiVersion: core.orka.ai/v1alpha1
kind: AgentRuntime
metadata:
  name: fibey-agentkit-runtime
spec:
  contractVersion: orka.harness.v2
  deployment:
    mode: external-endpoint
    endpoint: http://fibey-agentkit-runtime.orka-system.svc.cluster.local:8080
  clientAuth:
    controllerBearerTokenSecretRef:
      name: fibey-agentkit-controller-auth
      key: token
    operationCapabilitySecretRef:
      name: fibey-agentkit-operation-auth
      key: capability-secret
  capabilities:
    profile:
      providerKind: agentkit
      workspaceIntent: read
    mcpPolicy:
      allowedTools: []
      disallowedTools: []
      allowBash: false
      approvalRequiredTools: []
